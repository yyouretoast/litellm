name: "Mutation Test (manual)"

# Manually-triggered mutation testing. Runs mutmut against the scope
# configured in [tool.mutmut] in pyproject.toml (currently the
# litellm/proxy/management_endpoints/ folder). Intended cadence is roughly
# weekly — clicked from the Actions tab when someone wants a fresh report.
#
# Uploads a structured `mutation-report.md` (Meta ACH-style: original +
# mutated function with `# MUTANT START`/`# MUTANT END` delimiters + the
# existing tests + a task instruction) as a workflow artifact. Failures
# do not block anything because nothing depends on this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Run mutmut
    runs-on: ubuntu-latest
    # Whole-folder mutation against ~15 files / ~7.5k LOC can take hours.
    # 350 minutes is just under the GitHub-hosted job cap of 360 minutes.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build

      - name: Install dependencies
        run: |
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router --extra saml

      - name: Cache Prisma binaries
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      # mutmut 3.x runs tests inside a `mutants/` sandbox where it injects
      # mutation trampolines. uv installs the project as editable by default,
      # which puts the original source dir on sys.path via a .pth file and
      # shadows the sandbox copy — so tests would never exercise the mutated
      # code. Reinstalling non-editable removes the .pth shadow.
      - name: Reinstall litellm non-editable (so mutants/ is not shadowed)
        run: |
          uv pip uninstall litellm
          uv pip install . --no-deps

      # pytest-retry's pytest_configure hook crashes with
      # `INTERNALERROR: no option named 'filtered_exceptions'` when invoked
      # via mutmut's in-process pytest.main() call. The entry-point name
      # doesn't normalize cleanly with `-p no:<name>`, so just remove the
      # package outright. Reruns are wrong for mutation testing anyway —
      # rerunning a "failed" mutant test would mask which mutants are killed.
      - name: Remove pytest plugins that conflict with mutmut
        run: |
          uv pip uninstall pytest-retry || true

      # DIAGNOSTIC BRANCH, NOT FOR MERGE. Narrow the mutation scope to one
      # small file so the sandbox is built in minutes instead of an hour, then
      # run the whole mapped test folder inside that sandbox with no -x, to get
      # the complete list of tests that cannot run there. The real run uses -x
      # during stats collection, so it only ever names the first offender.
      - name: Narrow the mutation scope
        run: |
          python - <<'EOF'
          p = "pyproject.toml"
          s = open(p).read()
          s = s.replace('    "litellm/proxy/management_endpoints/",\n',
                        '    "litellm/proxy/management_endpoints/ui_sso.py",\n')
          open(p, "w").write(s)
          EOF
          sed -n '/paths_to_mutate/,/]/p' pyproject.toml

      - name: Build the mutants sandbox
        timeout-minutes: 60
        env:
          PYTHONPATH: ${{ github.workspace }}/mutants
          COVERAGE_RCFILE: ${{ github.workspace }}/.github/mutmut-coverage.rc
        run: |
          mkdir -p mutants
          set +e
          # We only need the sandbox tree, not a finished mutation run. Bound it
          # hard so this step cannot eat the job and skip the census below.
          timeout 2400 uv run --no-sync --with mutmut==3.5.0 mutmut run 2>&1 | tee mutmut-run.log
          echo "mutmut/timeout exited ${PIPESTATUS[0]}"
          ls -d mutants/tests mutants/litellm 2>&1
          echo "sandbox file count: $(find mutants -name '*.py' | wc -l)"
          exit 0

      - name: Census every test that fails inside the sandbox
        if: always()
        timeout-minutes: 90
        env:
          PYTHONPATH: ${{ github.workspace }}/mutants
        run: |
          cd mutants
          set +e
          uv run --no-sync python -m pytest \
            tests/test_litellm/proxy/management_endpoints/ \
            -p no:retry -p no:rerunfailures -p no:xdist \
            --ignore=tests/test_litellm/proxy/management_endpoints/test_saml_sso.py \
            -q -rf --continue-on-collection-errors \
            > ../sandbox-census.log 2>&1
          echo "pytest exited $?"
          cd ..
          echo "===== tail ====="
          tail -40 sandbox-census.log
          echo "===== FAILED / ERROR lines ====="
          grep -E "^(FAILED|ERROR)" sandbox-census.log | tee sandbox-failures.txt
          echo "===== count ====="
          wc -l < sandbox-failures.txt

      # Same folder, same flags, WITHOUT the sandbox, as the control. If a test
      # fails here too it is a plain test bug, not a sandbox artifact.
      - name: Control run outside the sandbox
        if: always()
        timeout-minutes: 90
        run: |
          set +e
          uv run --no-sync python -m pytest \
            tests/test_litellm/proxy/management_endpoints/ \
            -p no:retry -p no:rerunfailures -p no:xdist \
            --ignore=tests/test_litellm/proxy/management_endpoints/test_saml_sso.py \
            -q -rf --continue-on-collection-errors \
            > control-census.log 2>&1
          echo "pytest exited $?"
          tail -20 control-census.log
          grep -E "^(FAILED|ERROR)" control-census.log | tee control-failures.txt
          wc -l < control-failures.txt

      - name: Upload mutmut artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: mutmut-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-report.md
            mutmut-results.txt
            mutmut-run.log
            sandbox-census.log
            sandbox-failures.txt
            control-census.log
            control-failures.txt
            mutants/mutmut-stats.json
            mutants/mutmut-cicd-stats.json
            mutants/**/*.meta
            mutants/litellm/proxy/management_endpoints/**/*.py
          if-no-files-found: warn
          retention-days: 14
